name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Real Postgres and Redis for the migration check and the container smoke test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_secret_key_123
      JWT_EXPIRES_IN: 15m
      SMTP_FROM: test@example.com
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Non-mutating: fails on problems instead of silently fixing them on the runner.
      # Needs "lint:check": "eslint \"src/**/*.ts\"" in package.json
      - name: Lint check
        run: npm run lint:check

      - name: Run Database Migrations
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm test -- --ci

      - name: Build
        run: npm run build

      # Must run BEFORE the smoke test, which uses this image
      - name: Build Docker image
        run: docker build -t poft-backend .

      - name: Smoke test the container
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="$REDIS_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e JWT_EXPIRES_IN="$JWT_EXPIRES_IN" \
            -e SMTP_FROM="$SMTP_FROM" \
            poft-backend
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1

